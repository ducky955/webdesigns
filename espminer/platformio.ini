; ESPMiner - Bitcoin solo/lottery miner for ESP32
; Build:  pio run -e esp32dev
; Flash:  pio run -e esp32dev -t upload && pio device monitor

[common]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -O3
    -ffast-math
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
platform = espressif32@^6.8.1
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

; Most cheap "ESP32 dev board" clones are fine with esp32dev above.
; Boards below are provided for convenience.

[env:esp32-s3]
platform = espressif32@^6.8.1
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

[env:lolin32]
platform = espressif32@^6.8.1
board = lolin32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

; ESP32 with a 128x64 SSD1306 I2C OLED (SDA=21, SCL=22 by default)
[env:esp32dev-oled]
platform = espressif32@^6.8.1
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps =
    ${common.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
build_flags =
    ${common.build_flags}
    -DUSE_OLED=1
